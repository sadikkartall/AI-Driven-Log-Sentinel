services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: log-sentinel-backend
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs:ro
    environment:
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: log-sentinel-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./outputs:/app/outputs:ro
    environment:
      - API_URL=http://backend:8000
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_HEADLESS=true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8501/_stcore/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
